<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>えいごクイズ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kundo ProN', 'Hiragino Sans', sans-serif;
    background: #f0f4ff;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    background: white; border-radius: 20px; padding: 28px;
    max-width: 500px; width: 100%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  .meta { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .quiz-title { font-size: 14px; font-weight: bold; color: #374151; flex: 1; }
  .badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: bold; }
  .badge-level { background: #dbeafe; color: #1d4ed8; }
  .badge-cat   { background: #dcfce7; color: #166534; }
  .progress-bar { background: #e5e7eb; border-radius: 10px; height: 7px; margin-bottom: 20px; overflow: hidden; }
  .progress-fill { background: #6366f1; height: 100%; border-radius: 10px; transition: width 0.4s; }
  .question-num { font-size: 12px; color: #9ca3af; margin-bottom: 10px; text-align: right; }
  .jp-hint { font-size: 12px; color: #9ca3af; text-align: center; margin-bottom: 6px; min-height: 16px; }
  .question-text { font-size: 18px; font-weight: bold; color: #1f2937; margin-bottom: 20px; text-align: center; line-height: 1.5; }
  .question-image { width: 100%; max-height: 200px; object-fit: contain; border-radius: 12px; margin-bottom: 16px; display: none; }
  .audio-btn { display: none; width: 100%; padding: 12px; background: #ede9fe; border: none; border-radius: 12px; font-size: 18px; cursor: pointer; margin-bottom: 16px; }
  .audio-btn:hover { background: #ddd6fe; }
  audio { display: none; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .choice-btn {
    padding: 14px 8px; border: 2px solid #e5e7eb; border-radius: 14px;
    background: white; font-size: 15px; cursor: pointer; transition: all 0.15s; text-align: center;
  }
  .choice-btn:hover:not(:disabled) { border-color: #6366f1; background: #f5f3ff; }
  .choice-btn.correct { border-color: #22c55e; background: #dcfce7; color: #15803d; font-weight: bold; }
  .choice-btn.wrong   { border-color: #ef4444; background: #fee2e2; color: #b91c1c; }
  .choice-btn:disabled { cursor: not-allowed; }
  .sort-area { display: none; margin-bottom: 16px; }
  .sort-label { font-size: 12px; color: #9ca3af; text-align: center; margin-bottom: 8px; }
  .sort-answer {
    min-height: 54px; border: 2px dashed #c4b5fd; border-radius: 14px;
    padding: 10px; display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 14px; background: #faf5ff; transition: border-color 0.2s, background 0.2s;
  }
  .sort-answer.ok-zone { border-color: #22c55e; background: #f0fdf4; }
  .sort-answer.ng-zone { border-color: #ef4444; background: #fff1f2; }
  .sort-tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 14px; min-height: 44px; }
  .tile {
    padding: 10px 16px; border: 2px solid #c4b5fd; border-radius: 12px;
    background: white; font-size: 15px; cursor: pointer;
    color: #5b21b6; font-weight: bold; transition: all 0.15s;
  }
  .tile:hover { background: #f5f3ff; border-color: #6366f1; }
  .tile.placed {
    padding: 8px 14px; border: 2px solid #6366f1; border-radius: 10px;
    background: #ede9fe; font-size: 14px; cursor: pointer;
    color: #4c1d95; font-weight: bold;
  }
  .tile.placed:hover { background: #ddd6fe; }
  .check-btn {
    width: 100%; padding: 13px; background: #6366f1; color: white;
    border: none; border-radius: 14px; font-size: 16px; font-weight: bold;
    cursor: pointer; transition: background 0.2s;
  }
  .check-btn:hover { background: #4f46e5; }
  .feedback { font-size: 20px; text-align: center; min-height: 32px; margin-bottom: 6px; }
  .correct-note { font-size: 12px; color: #6b7280; text-align: center; min-height: 16px; margin-bottom: 14px; }
  .next-btn {
    width: 100%; padding: 14px; background: #6366f1; color: white;
    border: none; border-radius: 14px; font-size: 16px; font-weight: bold;
    cursor: pointer; display: none; transition: background 0.2s;
  }
  .next-btn:hover { background: #4f46e5; }
  .result { text-align: center; display: none; padding: 10px 0; }
  .result-score { font-size: 56px; font-weight: bold; color: #6366f1; line-height: 1; }
  .result-label { font-size: 13px; color: #6b7280; margin: 6px 0 20px; }
  .result-msg { font-size: 20px; margin-bottom: 20px; }
  .retry-btn {
    padding: 12px 28px; background: #6366f1; color: white;
    border: none; border-radius: 14px; font-size: 15px; font-weight: bold; cursor: pointer;
  }
</style>
</head>
<body>

<!-- ================================================================
  ZONE A: データゾーン ── ここだけ編集する
  Claudeが生成したQUIZ_METAとquestionsをここに貼り付ける

  【もんだいのtype】
    "choice" : 4たくもんだい（typeを書かない場合のデフォルト）
    "sort"   : ごくのならびかえもんだい

  【choiceのschema】
    id       : 下記命名規則のユニークID（必須）
    type     : "choice"（省略可）
    text     : もんだいぶん。空欄は ( ) で表記（必須）
    jp_hint  : ひらがなのヒント（任意、nullでOK）
    image    : 画像パス 例"images/cat.png"（任意、nullでOK）
    audio    : 音声パス 例"audio/n001.mp3"（任意、nullでOK）
    choices  : 4たくの選択肢の配列（必須）
    answer   : 正解（choicesのどれかと完全一致）（必須）

  【sortのschema】
    id       : ユニークID（必須）
    type     : "sort"（必須）
    text     : "ならびかえてみよう！" など（必須）
    jp_hint  : 日本語訳をひらがなで（任意）
    words    : ばらばらにした単語の配列（必須）
    answer   : 正しい語順をスペースでつないだ文字列（必須）
               ※ words内の要素をスペースで並べたものと一致させる
    image    : null
    audio    : null

  【id命名規則】全ファイル通じてユニークにすること
    n___  : 名詞    v___  : 動詞    adj__ : 形容詞
    adv__ : 副詞    phr__ : 熟語    conv_ : 会話文
    gr___ : 文法    sort_ : ならびかえ
    連番3桁 例: v001, sort003
================================================================ -->
<script>
const QUIZ_META = {
  title: "えいけん3きゅうレベル じゅく語クイズ vol.1",
  level: "3",
  category: "じゅく語"
};

const questions = [
  {
    id: "phr001",
    type: "choice",
    text: "I'm ( ) my keys. Have you seen them?",
    jp_hint: "かぎをさがしています。みましたか？",
    image: null,
    audio: null,
    choices: ["looking for", "looking at", "looking up", "looking after"],
    answer: "looking for"
  },
  {
    id: "sort001",
    type: "sort",
    text: "ならびかえてみよう！",
    jp_hint: "わたしはまいにちがっこうへいきます。",
    words: ["school", "go", "I", "to", "every", "day"],
    answer: "I go to school every day",
    image: null,
    audio: null
  },
  {
    id: "phr002",
    type: "choice",
    text: "Don't ( ) up. You can do it!",
    jp_hint: "あきらめないで。できるよ！",
    image: null,
    audio: null,
    choices: ["give", "take", "put", "get"],
    answer: "give"
  },
  {
    id: "sort002",
    type: "sort",
    text: "ならびかえてみよう！",
    jp_hint: "かれはねこがとてもすきです。",
    words: ["cats", "He", "likes", "very", "much"],
    answer: "He likes cats very much",
    image: null,
    audio: null
  }
];
</script>
<!-- ZONE A ここまで ============================================ -->


<!-- UI（触らない） -->
<div class="card">
  <div class="meta">
    <span class="quiz-title" id="quizTitle"></span>
    <span class="badge badge-level" id="badgeLevel"></span>
    <span class="badge badge-cat" id="badgeCat"></span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div id="quizArea">
    <div class="question-num" id="questionNum"></div>
    <img class="question-image" id="qImage" alt="もんだいのえ">
    <button class="audio-btn" id="audioBtn" onclick="playAudio()">🔊 きいてみよう</button>
    <audio id="qAudio"></audio>
    <div class="jp-hint" id="jpHint"></div>
    <div class="question-text" id="questionText"></div>

    <div class="choices" id="choices"></div>

    <div class="sort-area" id="sortArea">
      <div class="sort-label">ここにならべよう</div>
      <div class="sort-answer" id="sortAnswer"></div>
      <div class="sort-label">ことばをえらんでね</div>
      <div class="sort-tiles" id="sortTiles"></div>
      <button class="check-btn" onclick="checkSort()">こたえをみる</button>
    </div>

    <div class="feedback" id="feedback"></div>
    <div class="correct-note" id="correctNote"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">つぎのもんだい →</button>
  </div>

  <div class="result" id="resultArea">
    <div class="result-score" id="scoreNum"></div>
    <div class="result-label">せいかいすう</div>
    <div class="result-msg" id="resultMsg"></div>
    <button class="retry-btn" onclick="startQuiz()">もういちどやる 🔄</button>
  </div>
</div>


<!-- ================================================================
  ZONE B: エンジンゾーン ── 触らない
  ZONE AのQUIZ_METAとquestions変数を読むだけ。
================================================================ -->
<script>
let current = 0, score = 0, answered = false, placedWords = [];

function startQuiz() {
  current = 0; score = 0; answered = false;
  document.getElementById('quizArea').style.display = '';
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('quizTitle').textContent = QUIZ_META.title;
  document.getElementById('badgeLevel').textContent = 'えいけん' + QUIZ_META.level + 'きゅうレベル';
  document.getElementById('badgeCat').textContent = QUIZ_META.category;
  renderQuestion();
}

function renderQuestion() {
  answered = false; placedWords = [];
  const q = questions[current], total = questions.length;
  document.getElementById('progressFill').style.width = (current / total * 100) + '%';
  document.getElementById('questionNum').textContent = (current + 1) + ' / ' + total;
  document.getElementById('questionText').textContent = q.text;
  document.getElementById('jpHint').textContent = q.jp_hint || '';
  document.getElementById('feedback').textContent = '';
  document.getElementById('correctNote').textContent = '';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('sortAnswer').className = 'sort-answer';

  const img = document.getElementById('qImage');
  if (q.image) { img.src = q.image; img.style.display = 'block'; } else { img.style.display = 'none'; }

  const audio = document.getElementById('qAudio');
  const audioBtn = document.getElementById('audioBtn');
  if (q.audio) { audio.src = q.audio; audioBtn.style.display = 'block'; } else { audioBtn.style.display = 'none'; }

  if (q.type === 'sort') {
    document.getElementById('choices').style.display = 'none';
    document.getElementById('sortArea').style.display = 'block';
    document.getElementById('sortAnswer').innerHTML = '';
    const tilesDiv = document.getElementById('sortTiles');
    tilesDiv.innerHTML = '';
    [...q.words].sort(() => Math.random() - 0.5).forEach((w, i) => {
      const t = document.createElement('button');
      t.className = 'tile'; t.textContent = w; t.dataset.uid = i;
      t.onclick = () => placeTile(t, w);
      tilesDiv.appendChild(t);
    });
  } else {
    document.getElementById('choices').style.display = 'grid';
    document.getElementById('sortArea').style.display = 'none';
    const cd = document.getElementById('choices');
    cd.innerHTML = '';
    q.choices.forEach(c => {
      const b = document.createElement('button');
      b.className = 'choice-btn'; b.textContent = c;
      b.onclick = () => checkChoice(b, c, q.answer);
      cd.appendChild(b);
    });
  }
}

function placeTile(t, w) {
  if (answered) return;
  const uid = t.dataset.uid;
  placedWords.push({ word: w, uid });
  t.remove();
  const placed = document.createElement('button');
  placed.className = 'tile placed'; placed.textContent = w; placed.dataset.uid = uid;
  placed.onclick = () => returnTile(placed, w, t);
  document.getElementById('sortAnswer').appendChild(placed);
}

function returnTile(placed, w, origTile) {
  if (answered) return;
  placedWords = placedWords.filter(p => p.uid !== placed.dataset.uid);
  placed.remove();
  origTile.className = 'tile';
  document.getElementById('sortTiles').appendChild(origTile);
}

function checkSort() {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const userAns = placedWords.map(p => p.word).join(' ');
  const zone = document.getElementById('sortAnswer');
  zone.querySelectorAll('.tile').forEach(b => b.style.cursor = 'not-allowed');
  document.getElementById('sortTiles').querySelectorAll('.tile').forEach(b => { b.disabled = true; b.style.opacity = '0.4'; });
  if (userAns === q.answer) {
    score++; zone.classList.add('ok-zone');
    document.getElementById('feedback').textContent = '⭕ せいかい！';
  } else {
    zone.classList.add('ng-zone');
    document.getElementById('feedback').textContent = '❌ ざんねん！';
    document.getElementById('correctNote').textContent = 'こたえ：' + q.answer;
  }
  document.getElementById('nextBtn').style.display = 'block';
}

function checkChoice(btn, selected, answer) {
  if (answered) return;
  answered = true;
  document.querySelectorAll('.choice-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === answer) b.classList.add('correct');
  });
  if (selected === answer) {
    score++; btn.classList.add('correct');
    document.getElementById('feedback').textContent = '⭕ せいかい！';
  } else {
    btn.classList.add('wrong');
    document.getElementById('feedback').textContent = '❌ ざんねん！';
    document.getElementById('correctNote').textContent = 'こたえ：' + answer;
  }
  document.getElementById('nextBtn').style.display = 'block';
}

function nextQuestion() {
  current++;
  if (current < questions.length) { renderQuestion(); } else { showResult(); }
}

function showResult() {
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('resultArea').style.display = 'block';
  const total = questions.length;
  document.getElementById('scoreNum').textContent = score + '/' + total;
  const r = score / total;
  document.getElementById('resultMsg').textContent =
    r === 1 ? '🎉 ぜんぶせいかい！' :
    r >= 0.75 ? '😊 よくできました！' :
    r >= 0.5 ? '🤔 もうすこしがんばろう！' : '💪 れんしゅうしよう！';
}

function playAudio() { document.getElementById('qAudio').play(); }

startQuiz();
</script>
</body>
</html>
