<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>えいごクイズ もくじ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', 'Noto Sans JP', sans-serif;
    background: #fff9f0;
    min-height: 100vh;
    padding: 32px 16px 48px;
    background-image:
      radial-gradient(circle at 10% 15%, rgba(255,107,107,0.07) 0%, transparent 45%),
      radial-gradient(circle at 90% 85%, rgba(78,205,196,0.08) 0%, transparent 45%);
  }

  .page-wrap {
    max-width: 560px;
    margin: 0 auto;
  }

  /* Header */
  .site-header {
    text-align: center;
    margin-bottom: 36px;
  }
  .site-icon { font-size: 48px; margin-bottom: 8px; }
  .site-title {
    font-size: 26px;
    font-weight: 900;
    color: #1f2937;
    line-height: 1.3;
    margin-bottom: 6px;
  }
  .site-sub {
    font-size: 13px;
    color: #9ca3af;
    font-weight: 700;
  }

  /* Random button */
  .random-btn {
    display: block;
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #ff6b6b, #ffa94d);
    color: white;
    border: none;
    border-radius: 18px;
    font-size: 17px;
    font-weight: 900;
    font-family: 'Nunito', 'Noto Sans JP', sans-serif;
    text-decoration: none;
    text-align: center;
    margin-bottom: 32px;
    box-shadow: 0 4px 0 #e03131;
    transition: transform 0.15s, box-shadow 0.15s;
    cursor: pointer;
    letter-spacing: 0.3px;
  }
  .random-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 0 #e03131;
  }
  .random-btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #e03131;
  }

  /* Section label */
  .section-label {
    font-size: 11px;
    font-weight: 900;
    color: #9ca3af;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 12px;
    padding-left: 4px;
  }

  /* Quiz cards */
  .quiz-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 40px;
  }

  .quiz-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: white;
    border-radius: 18px;
    padding: 16px 18px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    border: 2px solid transparent;
    transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
  }
  .quiz-card:hover {
    border-color: #c4b5fd;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.09);
  }

  .card-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }
  .icon-sort   { background: #ede9fe; }
  .icon-choice { background: #e0f2fe; }
  .icon-mix    { background: #fef3c7; }

  .card-body { flex: 1; min-width: 0; }
  .card-title {
    font-size: 14px;
    font-weight: 900;
    color: #1f2937;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-meta {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .badge {
    font-size: 10px;
    font-weight: 900;
    padding: 2px 8px;
    border-radius: 20px;
  }
  .badge-sort   { background: #ede9fe; color: #6d28d9; }
  .badge-choice { background: #e0f2fe; color: #0369a1; }
  .badge-mix    { background: #fef3c7; color: #92400e; }
  .badge-cat    { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
  .badge-count  { background: #f1f5f9; color: #475569; }

  .card-arrow {
    font-size: 18px;
    color: #d1d5db;
    flex-shrink: 0;
  }

  /* Footer */
  .site-footer {
    text-align: center;
    font-size: 12px;
    color: #d1d5db;
    font-weight: 700;
  }
</style>
</head>
<body>

<!-- ================================================================
  もくじデータ ── ここだけ編集する

  quizzes配列に問題セットを追加していく。
  type:  "sort"（ならびかえ）/ "choice"（4たく）/ "mix"（まじり）
  cat:   カテゴリ名（例: "ならびかえ", "動詞", "熟語"）
  count: 問題数
  file:  published/ フォルダ内のHTMLファイル名
================================================================ -->
<script>
const SITE_TITLE = "えいごクイズ";
const SITE_SUB   = "えいけん3きゅうレベル";

const quizzes = [
  {
    title: "ならびかえ vol.1（名詞トピック）",
    type: "sort",
    cat: "ならびかえ",
    count: 10,
    file: "published/quiz_sort_001-010.html"
  },
  {
    title: "ならびかえ vol.2（食べ物・レストラン）",
    type: "sort",
    cat: "食べ物",
    count: 10,
    file: "published/quiz_sort_011-020.html"
  },
  {
    title: "ならびかえ vol.3（食べ物・料理）",
    type: "sort",
    cat: "食べ物",
    count: 10,
    file: "published/quiz_sort_021-030.html"
  },
  {
    title: "どうし 4たく vol.1（日常テーマ）",
    type: "choice",
    cat: "動詞",
    count: 10,
    file: "published/quiz_v_001-010.html"
  },
  {
    title: "どうし 4たく vol.2（日常テーマ）",
    type: "choice",
    cat: "動詞",
    count: 10,
    file: "published/quiz_v_011-020.html"
  },
];

const RANDOM_FILE = "published/quiz_random.html";
</script>
<!-- ここまで ===================================================== -->


<div class="page-wrap">

  <header class="site-header">
    <div class="site-icon">📚</div>
    <div class="site-title" id="siteTitle"></div>
    <div class="site-sub" id="siteSub"></div>
  </header>

  <a class="random-btn" id="randomBtn" href="#">
    🎲 ランダムでといてみる！
  </a>

  <a href="published/treasure.html" style="
    display: block; width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #f59e0b, #fbbf24);
    color: white;
    border: none;
    border-radius: 18px;
    font-size: 16px;
    font-weight: 900;
    font-family: 'Nunito', 'Noto Sans JP', sans-serif;
    text-decoration: none;
    text-align: center;
    margin-bottom: 32px;
    box-shadow: 0 4px 0 #d97706;
    letter-spacing: 0.3px;
  ">🎁 たからばこを ひらこう！</a>

  <div class="section-label">もんだいセット</div>
  <div class="quiz-list" id="quizList"></div>

  <footer class="site-footer">えいけん3きゅうレベル相当の自主学習教材です</footer>

</div>

<script>
const TYPE_ICON  = { sort: "🔀", choice: "✅", mix: "🎯" };
const TYPE_LABEL = { sort: "ならびかえ", choice: "4たく", mix: "まじり" };
const TYPE_BADGE = { sort: "badge-sort",  choice: "badge-choice", mix: "badge-mix" };
const CARD_ICON  = { sort: "icon-sort",   choice: "icon-choice",  mix: "icon-mix"  };

document.getElementById('siteTitle').textContent = SITE_TITLE;
document.getElementById('siteSub').textContent   = SITE_SUB;
document.getElementById('randomBtn').href        = RANDOM_FILE;

const list = document.getElementById('quizList');
quizzes.forEach(q => {
  const a = document.createElement('a');
  a.className = 'quiz-card';
  a.href = q.file;
  a.innerHTML = `
    <div class="card-icon ${CARD_ICON[q.type]}">${TYPE_ICON[q.type]}</div>
    <div class="card-body">
      <div class="card-title">${q.title}</div>
      <div class="card-meta">
        <span class="badge ${TYPE_BADGE[q.type]}">${TYPE_LABEL[q.type]}</span>
        <span class="badge badge-cat">${q.cat}</span>
        <span class="badge badge-count">${q.count}もん</span>
      </div>
    </div>
    <div class="card-arrow">›</div>
  `;
  list.appendChild(a);
});
</script>

</body>
</html>
